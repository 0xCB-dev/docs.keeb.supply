# Preview deployments for PRs from forks.
#
# Cloudflare Pages' Git integration already builds PRs whose branch lives in
# this repo, but it never builds PRs from forks. This workflow fills that gap:
#
#   - A fork PR opened by a team member (OWNER / MEMBER / COLLABORATOR) is
#     deployed automatically: opening it counts as approval.
#   - A fork PR opened by anyone else is not deployed until a maintainer adds
#     the `preview` label.
#   - New commits pushed to a fork PR are NOT deployed automatically, because
#     the fork owner controls that branch. A maintainer re-approves them by
#     adding the `preview` label again. The label is removed after each deploy.
#
# Security: the untrusted PR code is built in a job that has no secrets and a
# read-only token. Only the static `public/` output is passed to the deploy
# job, which never checks out or runs PR code.

name: Fork preview

on:
  pull_request_target:
    types: [opened, reopened, labeled]

concurrency:
  group: fork-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository &&
      (
        (github.event.action != 'labeled' &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
        ||
        (github.event.action == 'labeled' && github.event.label.name == 'preview')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          # Deliberate: this job only runs after a maintainer approved the PR
          # (opened it themselves or added the `preview` label), it has no
          # secrets and a read-only token, and it uses no Actions cache.
          allow-unsafe-pr-checkout: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.1

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public/
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: public

      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.1

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy public
          --project-name=docs-keeb-supply
          --branch="pr-$PR"
          --commit-hash="$SHA"
          --commit-dirty=true

      - name: Comment preview URL
        run: >-
          gh pr comment "$PR" --body
          "Fork preview for \`${SHA:0:7}\`: https://pr-$PR.docs-keeb-supply.pages.dev

          New commits won't deploy automatically. Add the \`preview\` label to deploy them again."

      - name: Remove preview label
        if: github.event.action == 'labeled'
        run: gh pr edit "$PR" --remove-label preview
